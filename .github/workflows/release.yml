name: Release plugin

# Publie une nouvelle version quand on pousse un tag vX.Y.Z.
# L'asset "lahocy-topo.zip" garde toujours le même nom : c'est ce qui
# permet à QField de mettre à jour le plugin en place plutôt que d'en
# installer un doublon (voir README.md). Le projet QField générique est
# publié à côté ("LahocyTopo-projet.zip"), ainsi que le pont local.

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Verify metadata.txt version matches the tag
        run: |
          META_VERSION=$(grep -E '^version=' plugin/metadata.txt | cut -d= -f2 | tr -d '\r')
          if [ "$META_VERSION" != "${{ steps.version.outputs.version }}" ]; then
            echo "::error::plugin/metadata.txt version ($META_VERSION) ne correspond pas au tag (${{ steps.version.outputs.version }})"
            exit 1
          fi

      - name: Build plugin zip
        run: |
          cd plugin
          zip -r "../lahocy-topo.zip" . -x "*.DS_Store"
          cp "../lahocy-topo.zip" "../lahocy-topo-${{ steps.version.outputs.version }}.zip"

      - name: Build project and bridge zips
        run: |
          cd project && zip -r "../LahocyTopo-projet.zip" LahocyTopo -x "*~" && cd ..
          zip -r "lahocy-bridge.zip" bridge -x "*/__pycache__/*"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "lahocy-topo.zip" \
            "lahocy-topo-${{ steps.version.outputs.version }}.zip" \
            "LahocyTopo-projet.zip" \
            "lahocy-bridge.zip" \
            --title "Lahocy Topo ${{ steps.version.outputs.version }}" \
            --notes-file RELEASE_NOTES.md
